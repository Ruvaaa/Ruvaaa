name: Connect 4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'connect4|')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: connect4/requirements.txt

      - name: Install dependencies
        run: pip install -r connect4/requirements.txt

      - name: Play move
        id: play
        env:
          # Passed as an env var, not interpolated into the script text,
          # so an untrusted issue title can never break out of the
          # command or inject shell code - it's always just a string value.
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          RESULT=$(python3 connect4/play.py \
            --title "$ISSUE_TITLE" \
            --repo "${{ github.repository }}" \
            --branch "main")
          echo "$RESULT"
          echo "comment<<COMMENT_EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["comment"])' >> "$GITHUB_OUTPUT"
          echo "COMMENT_EOF" >> "$GITHUB_OUTPUT"
          echo "changed=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changed"])')" >> "$GITHUB_OUTPUT"

      - name: Commit board update
        if: steps.play.outputs.changed == 'True'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add connect4/state.json connect4/board.png connect4/status.png README.md
          git commit -m "Connect 4 move"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        env:
          # Same principle: the comment text (which may contain
          # backticks, quotes, ${...}, etc.) is read from process.env
          # inside the script rather than spliced into the script's
          # source text, so it can never be parsed as code.
          COMMENT: ${{ steps.play.outputs.comment }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT
            });

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
