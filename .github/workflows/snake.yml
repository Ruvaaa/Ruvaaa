name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ruvaaa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF69B4&color_dots=#FFF0F5,#F8BBD0,#F48FB1,#EC407A,#D81B60
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF69B4&color_dots=#1A0A1A,#4A1830,#8E2C5C,#D94F91,#FF69B4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
