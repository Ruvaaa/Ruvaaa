name: Generate GitHub Contribution Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate Snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: Ruvaaa
      outputs: |
        dist/github-contribution-grid-snake.svg?color_snake=pink&color_dots=#FCE4EC,#F8BBD0,#F48FB1,#EC407A,#D81B60
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#1A0A12,#4A1830,#8E2C5C,#D94F91,#FF69B4
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Publish Snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
      target_branch: output
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
