name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ruvaaa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
